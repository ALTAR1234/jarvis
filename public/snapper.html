<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snapper</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'">
<link rel="stylesheet" href="panels.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #000; cursor: crosshair; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  #tools { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; padding: 7px; border-radius: 16px; background: rgb(6 18 32 / .94); box-shadow: inset 0 0 0 1px var(--edge), 0 12px 30px rgb(0 0 0 / .5); cursor: default; z-index: 2; }
  #tools button { height: 38px; padding: 0 13px; border-radius: 11px; font-weight: 650; color: var(--dim); }
  #tools button:hover { background: var(--card-2); color: #fff; }
  #tools button.on { background: rgb(56 207 255 / .25); color: #fff; }
  #tools .sep { width: 1px; background: var(--edge); margin: 4px 4px; }
  #tools .primary { background: var(--cyan); color: #021220; }
  #tools input[type=color] { width: 38px; height: 38px; border: 0; background: none; padding: 4px; }
  #crop { position: fixed; border: 2px dashed #38cfff; box-shadow: 0 0 0 9999px rgb(0 0 0 / .45); pointer-events: none; z-index: 1; }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="crop" hidden></div>
  <div id="tools">
    <button data-tool="crop" class="on" title="Drag to choose the part to keep">✂ Crop</button>
    <button data-tool="pen" title="Draw">✎ Draw</button>
    <button data-tool="box" title="Draw a box around something">▭ Box</button>
    <button data-tool="blur" title="Hide something (pixelate it)">▦ Blur</button>
    <input type="color" id="color" value="#ff4d6d" title="Colour">
    <button id="undo" title="Undo (Ctrl+Z)">↶</button>
    <span class="sep"></span>
    <button id="copy" class="primary" title="Copy to the clipboard (Ctrl+C)">Copy</button>
    <button id="save" title="Save to Pictures\Snapper (Ctrl+S)">Save</button>
    <button id="close" title="Close (Esc)">✕</button>
  </div>
  <script src="kit.js"></script>
  <script src="snapper.js"></script>
</body>
</html>

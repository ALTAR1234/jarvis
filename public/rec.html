<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>recording</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; media-src 'self' blob:">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 700 14px 'Segoe UI', sans-serif; color: #fff; user-select: none; }
  .pill { position: absolute; inset: 4px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 14px; border-radius: 999px; background: rgb(20 8 14 / .95); box-shadow: inset 0 0 0 1px rgb(255 77 109 / .6), 0 8px 24px rgb(0 0 0 / .5); }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #ff4d6d; box-shadow: 0 0 10px #ff4d6d; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  #t { flex: 1; font-variant-numeric: tabular-nums; }
  button { height: 32px; padding: 0 14px; border: 0; border-radius: 16px; background: #ff4d6d; color: #fff; font: inherit; cursor: pointer; }
</style>
</head>
<body>
  <div class="pill"><span class="dot"></span><span id="t">0:00</span><button id="stop" title="Stop (Ctrl+Alt+R)">Stop</button></div>
  <script src="rec.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Filer</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'">
<link rel="stylesheet" href="panels.css">
<style>
  .wrap { max-width: 1240px; }
  .layout { display: grid; grid-template-columns: 200px 1fr; gap: 16px; }
  .places button { display: block; width: 100%; text-align: left; padding: 9px 12px; border-radius: 10px; color: var(--dim); font-weight: 650; }
  .places button:hover, .places button.on { background: var(--card-2); color: #fff; }
  .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  .bar .field { flex: 1; }
  .crumbs { color: var(--dim); font-size: 13px; margin-bottom: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .crumbs button { color: var(--cyan); font-weight: 650; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .f { position: relative; padding: 10px; border-radius: 14px; text-align: center; background: var(--card); box-shadow: inset 0 0 0 1px var(--edge); }
  .f:hover { background: var(--card-2); }
  .f .ic { height: 86px; display: grid; place-items: center; font-size: 40px; margin-bottom: 6px; border-radius: 10px; background: rgb(0 0 0 / .2) center / cover no-repeat; }
  .f b { display: block; font-size: 12.5px; font-weight: 650; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .f small { color: var(--faint); font-size: 11.5px; }
  .menu { position: fixed; z-index: 5; padding: 6px; border-radius: 12px; background: rgb(8 26 44 / .98); box-shadow: inset 0 0 0 1px var(--edge), 0 12px 30px rgb(0 0 0 / .5); }
  .menu button { display: block; width: 100%; text-align: left; padding: 8px 14px; border-radius: 8px; font-weight: 600; }
  .menu button:hover { background: var(--card-2); }
  .note { color: var(--dim); font-size: 13px; margin: -4px 0 10px; }
</style>
</head>
<body>
  <div class="wrap">
    <header class="head"><span class="core"></span><div><h1>Filer</h1><p>Your files, and search you can just describe</p></div></header>
    <div class="layout">
      <nav class="places" id="places"></nav>
      <section>
        <form class="bar" id="find"><input class="field" id="q" placeholder="Search names, or describe it: “the PDF my teacher sent last week”"><button class="btn" id="byname" type="button">Name search</button><button class="btn primary">Ask J.A.R.V.I.S.</button></form>
        <div class="crumbs" id="crumbs"></div>
        <div class="note" id="note" hidden></div>
        <div class="grid" id="grid"></div>
      </section>
    </div>
  </div>
  <div class="menu" id="menu" hidden></div>
  <script src="kit.js"></script>
  <script src="filer.js"></script>
</body>
</html>
